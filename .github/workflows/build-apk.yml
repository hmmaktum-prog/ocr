name: Build Android APK

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LLAMA_CPP_TAG: b8683
  BINARY_RELEASE_TAG: llama-android-arm64-b8683

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. সোর্স কোড নামানো ───────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 সেটআপ ───────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Android SDK পাথ সেট করা ────────────────────────────────
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # ── 4. Gradle permission ────────────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 5. Gradle cache ─────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ── 6. Gradle wrapper যাচাই ─────────────────────────────────────
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      # ═══════════════════════════════════════════════════════════════
      # Keystore সেটআপ (GitHub Secrets থেকে)
      # ═══════════════════════════════════════════════════════════════

      # ── 7. Keystore decode & সেটআপ ────────────────────────────────
      - name: Setup release keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/paddleocr-release.jks
            if [ -s /tmp/paddleocr-release.jks ]; then
              echo "✅ Keystore ready: $(ls -lh /tmp/paddleocr-release.jks)"
              echo "KEYSTORE_PATH=/tmp/paddleocr-release.jks" >> $GITHUB_ENV
              echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
              echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
              echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            else
              echo "⚠️ Keystore decode failed (empty file). Release APK will be unsigned."
            fi
          else
            echo "⚠️ KEYSTORE_BASE64 secret not set. Release APK will be unsigned."
          fi

      # ═══════════════════════════════════════════════════════════════
      # llama-server binary: GitHub Release থেকে download, নইলে build
      # ═══════════════════════════════════════════════════════════════

      # ── 8. GitHub Release থেকে prebuilt binary download চেষ্টা ────
      - name: Try download prebuilt llama-server from GitHub Release
        id: binary-download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking GitHub Release: $BINARY_RELEASE_TAG"
          if gh release download "$BINARY_RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "llama-server-arm64" \
            --dir /tmp/ 2>/dev/null; then
            mv /tmp/llama-server-arm64 /tmp/llama-server-bin
            echo "BINARY_FROM_RELEASE=true" >> $GITHUB_ENV
            echo "✅ Prebuilt binary downloaded from release $BINARY_RELEASE_TAG"
            ls -lh /tmp/llama-server-bin
            file /tmp/llama-server-bin
          else
            echo "BINARY_FROM_RELEASE=false" >> $GITHUB_ENV
            echo "ℹ️ No prebuilt binary found — will build from source"
          fi

      # ── 9. NDK পাথ নির্ধারণ (build দরকার হলে) ─────────────────────
      - name: Detect Android NDK path
        if: env.BINARY_FROM_RELEASE != 'true'
        run: |
          if [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            echo "NDK_PATH=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          elif [ -n "$ANDROID_NDK" ] && [ -d "$ANDROID_NDK" ]; then
            echo "NDK_PATH=$ANDROID_NDK" >> $GITHUB_ENV
          elif [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "NDK_PATH=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          else
            NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | tail -1)
            if [ -n "$NDK_DIR" ]; then
              echo "NDK_PATH=$NDK_DIR" >> $GITHUB_ENV
            else
              echo "Installing NDK 26.3.11579264 ..."
              $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264" > /dev/null
              echo "NDK_PATH=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
            fi
          fi

      # ── 10. Build dependencies (build দরকার হলে) ───────────────────
      - name: Install CMake and Ninja
        if: env.BINARY_FROM_RELEASE != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build

      # ── 11. llama.cpp clone (build দরকার হলে) ───────────────────────
      - name: Clone llama.cpp source
        if: env.BINARY_FROM_RELEASE != 'true'
        run: |
          git clone --depth 1 --branch $LLAMA_CPP_TAG \
            https://github.com/ggerganov/llama.cpp.git /tmp/llama-cpp
          echo "Cloned llama.cpp $LLAMA_CPP_TAG"

      # ── 12. llama-server Android arm64 build (build দরকার হলে) ─────
      - name: Build llama-server for Android arm64-v8a
        if: env.BINARY_FROM_RELEASE != 'true'
        run: |
          cmake -B /tmp/llama-build \
            -S /tmp/llama-cpp \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_CURL=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build /tmp/llama-build --target llama-server -j$(nproc) \
            || cmake --build /tmp/llama-build -j$(nproc)

          SERVER_BIN=$(find /tmp/llama-build -type f -name "llama-server" \
            ! -path "*/CMakeFiles/*" | head -1)
          if [ -z "$SERVER_BIN" ]; then
            echo "❌ llama-server binary not found!"
            find /tmp/llama-build/bin -type f 2>/dev/null
            exit 1
          fi
          cp "$SERVER_BIN" /tmp/llama-server-bin
          echo "✅ Built: $(ls -lh /tmp/llama-server-bin)"
          file /tmp/llama-server-bin

      # ── 13. নতুন binary GitHub Release-এ upload করো ─────────────
      - name: Upload binary to GitHub Release (cache for future builds)
        if: env.BINARY_FROM_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$BINARY_RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --title "llama-server Android arm64 ($LLAMA_CPP_TAG)" \
            --notes "Pre-built llama-server binary for Android arm64-v8a (API 28+). Built from llama.cpp $LLAMA_CPP_TAG." \
            --prerelease 2>/dev/null || true

          gh release upload "$BINARY_RELEASE_TAG" \
            "/tmp/llama-server-bin#llama-server-arm64" \
            --repo "${{ github.repository }}" \
            --clobber

          echo "✅ Binary uploaded to release $BINARY_RELEASE_TAG"

      # ── 14. Binary → APK assets-এ রাখো ──────────────────────────
      - name: Embed llama-server into APK assets
        run: |
          cp /tmp/llama-server-bin app/src/main/assets/llama-server
          echo "✅ llama-server embedded: $(ls -lh app/src/main/assets/llama-server)"
          file app/src/main/assets/llama-server
          head -c 4 app/src/main/assets/llama-server | xxd | head -1

      # ═══════════════════════════════════════════════════════════════
      # APK Build
      # ═══════════════════════════════════════════════════════════════

      # ── 15. Lint চেক ────────────────────────────────────────────────
      - name: Run Lint
        run: ./gradlew lintDebug --no-daemon
        continue-on-error: true

      - name: Upload Lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: ignore

      # ── 16. Unit Test ───────────────────────────────────────────────
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: Upload Test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore

      # ── 17. Debug APK ────────────────────────────────────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 18. Signed Release APK ────────────────────────────────────
      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signing
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK" ]; then
            echo "✅ Signed APK found: $(ls -lh $APK)"
            $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)/apksigner verify --verbose "$APK" 2>&1 | head -5 || true
          else
            echo "⚠️ Signed APK not found, checking for unsigned..."
            ls app/build/outputs/apk/release/
          fi

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
          if-no-files-found: ignore

  # ══════════════════════════════════════════════════════════════════
  # GitHub Release (tag push হলেই শুধু)
  # ══════════════════════════════════════════════════════════════════
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Signed Release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-signed-${{ github.run_number }}
          path: ./apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./apk/app-release.apk
            ./apk/app-release-unsigned.apk
          name: "PaddleOCR-VL ${{ github.ref_name }}"
          body: |
            ## PaddleOCR-VL ${{ github.ref_name }}

            **llama-server**: llama.cpp ${{ env.LLAMA_CPP_TAG }} (Android arm64-v8a)

            ### ডাউনলোড
            - **app-release.apk** — Signed APK (সরাসরি ইনস্টল করুন)

            ### সমর্থিত ডিভাইস
            - **আর্কিটেকচার**: arm64-v8a (সকল আধুনিক Android ফোন)
            - **ন্যূনতম Android**: 9.0 (API 28)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
